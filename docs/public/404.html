<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binged — Not found</title>
<!--
  Cloudflare Pages serves this for any unmatched path. Without it, Pages fell
  back to index.html with a 200, so every wrong URL looked like a working
  homepage — including, in principle, a mistyped privacy link that a reviewer
  would report as "the policy is missing".
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1a1a1a; --muted: #5a5a5a; --accent: #6c40e0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131316; --fg: #ececf1; --muted: #a2a2ad; --accent: #a98bff; }
  }
  body {
    margin: 0; background: var(--bg); color: var(--fg); display: flex; min-height: 100vh;
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main { margin: auto; padding: 2rem 1.25rem; max-width: 28rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .5rem; letter-spacing: -.02em; }
  p { color: var(--muted); }
  a { color: var(--accent); margin-right: 1rem; }
</style>
</head>
<body>
<main>
  <h1>Nothing here</h1>
  <p>That page doesn’t exist.</p>
  <p><a href="/">Home</a><a href="/privacy">Privacy</a><a href="/support">Support</a></p>
</main>
</body>
</html>
